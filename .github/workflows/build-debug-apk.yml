name: Build debug APK

on:
  push:
    branches:
      - fix/questcraft-root-install
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Probe Google Maven
        run: |
          curl -fLsv -o /tmp/agp.pom https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.2.0/gradle-8.2.0.pom
          head -n 5 /tmp/agp.pom

      - name: Build debug APK
        run: gradle --no-daemon --refresh-dependencies --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QCOAM-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
